<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家中相册</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* static build: GitHub Pages serves files only, so importing and deleting
       cannot work here - hide those entry points instead of leaving dead buttons. */
    #addBtn, #ctxmenu button[data-act="delete"] { display: none !important; }
  </style></head>
<body>

<header class="site">
  <div class="site-inner">
    <a class="brand" href="#/">家中相册</a>
    <nav class="main">
      <a href="#/" data-nav="home">时间</a>
      <a href="#/people" data-nav="people">人物</a>
      <a href="#/all" data-nav="all">全部</a>
      <a href="#/unknown" data-nav="unknown">未识别<span class="badge" id="unkBadge" hidden>0</span></a>
    </nav>
    <div class="tools">
      <a class="learn-more learn-more--sm" id="displayBtn" href="start.html">
        <span class="circle" aria-hidden="true"><span class="icon arrow"></span></span>
        <span class="button-text">展示模式</span>
      </a>
      <button class="learn-more learn-more--sm" id="addBtn" type="button" hidden>
        <span class="circle" aria-hidden="true">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        </span>
        <span class="button-text">导入照片</span>
      </button>
      <button class="icon-btn" id="whoBtn" type="button" aria-pressed="false" aria-haspopup="dialog">
        <span id="whoIconBox" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="5" y="11" width="14" height="9" rx="2"/></svg></span>
        <span id="whoText">访客 · 只看</span>
      </button>
    </div>
  </div>
</header>

<main id="view"></main>

<footer class="foot">
  <div>草稿版本 · 示例照片为占位图 · 90 秒无人操作会自动进入展示模式</div>
</footer>

<div id="toast" class="toast"></div>
<div class="leave-veil" id="pageFade" aria-hidden="true"><span>家中相册</span></div>
<div class="enter-veil" id="enterVeil" aria-hidden="true"></div>

<!-- 点开看大图 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="看照片">
  <button class="lb-btn lb-close" type="button" data-lb="close" aria-label="关闭">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
  </button>
  <button class="lb-btn lb-prev" type="button" data-lb="prev" aria-label="上一张">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <img id="lbImg" alt="">
  <button class="lb-btn lb-next" type="button" data-lb="next" aria-label="下一张">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<!-- 右键/更多 菜单 -->
<div class="ctxmenu" id="ctxmenu" role="menu" aria-label="照片操作">
  <button type="button" role="menuitem" data-act="open">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>
    打开看
  </button>
  <button type="button" role="menuitem" data-act="delete" class="danger">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
    删掉
  </button>
</div>

<!-- 删除确认 -->
<div class="modal" id="delModal" role="dialog" aria-modal="true" aria-labelledby="delTitle">
  <div class="modal-veil" data-close></div>
  <div class="modal-panel" style="width:min(460px,calc(100vw - 2.5rem))">
    <div class="modal-head">
      <svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.6h.01"/></svg>
      <div>
        <h2 id="delTitle">删掉这张？</h2>
        <p id="delDesc"></p>
      </div>
      <button class="modal-close" type="button" data-close aria-label="关闭">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-actions">
      <button class="btn-solid" id="delOk" type="button">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
        删掉
      </button>
      <button class="btn-quiet" type="button" data-close>算了</button>
    </div>
  </div>
</div>

<!-- 家人口令 -->
<div class="modal" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="modal-veil" data-close></div>
  <div class="modal-panel">
    <div class="modal-head">
      <svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="5" y="11" width="14" height="9" rx="2"/></svg>
      <div>
        <h2 id="gateTitle">家里人才进得来</h2>
        <p>输一次口令就行。不输也能看，只是不能改。</p>
      </div>
      <button class="modal-close" type="button" data-close aria-label="关闭">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="field">
      <label for="gateCode">家里的口令</label>
      <input class="code-input" id="gateCode" type="password" inputmode="numeric" autocomplete="off"
             maxlength="8" placeholder="····" aria-describedby="gateMsg">
    </div>
    <div class="msg" id="gateMsg" role="alert">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.6h.01"/></svg>
      <span id="gateMsgText"></span>
    </div>
    <div class="modal-actions">
      <button class="btn-solid" id="gateOk" type="button">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 9.5-2"/><rect x="5" y="11" width="14" height="9" rx="2"/></svg>
        进去
      </button>
      <button class="btn-quiet" type="button" data-close>只看</button>
      <span class="spacer"></span>
      <span style="font-size:12px;color:var(--muted);letter-spacing:.08em">草稿口令 1234</span>
    </div>
  </div>
</div>

<!-- 导入照片 -->
<div class="modal" id="imp" role="dialog" aria-modal="true" aria-labelledby="impTitle">
  <div class="modal-veil" data-close></div>
  <div class="modal-panel">
    <div class="modal-head">
      <svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <div>
        <h2 id="impTitle">往相册里放照片</h2>
        <p>一整叠一起拖进来也行，或者点下面挑。传完先进「未识别」，等你认领。</p>
      </div>
      <button class="modal-close" type="button" data-close aria-label="关闭">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="drop" id="drop">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.4"/><path d="M21 16l-5-5-6 6"/></svg>
      <p>把照片拖到这里</p>
      <small>JPG / PNG / WEBP · 单张不超过 60MB</small>
    </div>

    <div class="modal-actions">
      <button class="btn-solid" id="pickBtn" type="button">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        选择照片
      </button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <span class="spacer"></span>
      <span id="impSummary" style="font-size:13px;color:var(--muted)"></span>
    </div>

    <div class="field">
      <label id="impTagLabel">这一批大概是什么事</label>
      <div class="tagrow" id="impTags" role="group" aria-labelledby="impTagLabel">
        <button class="tagchip" type="button" aria-pressed="false" data-tag="自拍">自拍</button>
        <button class="tagchip" type="button" aria-pressed="false" data-tag="过生日">过生日</button>
        <button class="tagchip" type="button" aria-pressed="false" data-tag="吃饭">吃饭</button>
        <button class="tagchip" type="button" aria-pressed="false" data-tag="出去玩">出去玩</button>
        <button class="tagchip" type="button" aria-pressed="false" data-tag="过年过节">过年过节</button>
        <button class="tagchip" type="button" aria-pressed="false" data-tag="在家">在家</button>
      </div>
    </div>

    <div class="field">
      <label for="impPlace">在哪拍的（可以空着）</label>
      <input class="text-input" id="impPlace" type="text" placeholder="比如：北京、老家、外婆家">
    </div>

    <div class="files" id="fileList" aria-live="polite"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="magnify.js"></script>
<script src="app.js"></script>
</body>
</html>
